<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>기운찬 콘텐츠 관리</title><link rel="stylesheet" href="/cms.css"><link rel="stylesheet" href="/vendor/jodit.min.css"><link rel="stylesheet" href="/cms-rich.css"></head><body class="cms-admin">
<header class="cms-top"><a href="/">기운찬 홈페이지</a><strong>콘텐츠 관리</strong><button id="logout" hidden>로그아웃</button></header>
<main><p id="message" role="status" aria-live="polite"></p>
<section id="login-panel" class="cms-login"><h1>관리자 로그인</h1><form id="login-form"><label>이메일<input id="email" type="email" autocomplete="username" required value="guc2203@naver.com"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button></form></section>
<section id="dashboard" hidden><div class="cms-actions"><h1>글 목록</h1><button id="new-post">＋ 새 글 작성</button></div><div class="cms-filters"><label>콘텐츠<select id="filter-category"><option value="">전체</option><option value="research-insight">연구 인사이트</option><option value="research-data">연구자료</option><option value="newsroom">뉴스룸</option></select></label><label>상태<select id="filter-status"><option value="">전체</option><option value="draft">초안</option><option value="published">게시됨</option><option value="archived">휴지통</option></select></label><label>제목 검색<input type="search" id="search"></label></div><div id="post-list" class="cms-card-grid"></div><button id="load-more" hidden>더 보기</button></section>
<section id="editor" hidden><div class="cms-actions"><h1>글 작성·수정</h1><button id="back">목록으로</button></div><form id="post-form"><div class="cms-fields">
<label>제목<input name="title" required maxlength="200"></label><label>콘텐츠 종류<select name="category"><option value="research-insight">연구 인사이트</option><option value="research-data">연구자료</option><option value="newsroom">뉴스룸</option></select></label>
<label>글 주소<span class="cms-help">영문 소문자·숫자·하이픈으로 입력하세요. 게시 후 주소를 유지합니다.</span><input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="150" placeholder="mushroom-life-cycle"></label><label>최초 게시일<input name="published_at" type="date" required><span id="date-note" class="cms-help"></span><span id="modified-note" class="cms-help"></span></label><label>작성자<input name="author" value="주식회사 기운찬" required></label><label>대표 이미지 설명<input name="thumbnail_alt" placeholder="이미지에 보이는 내용을 적어 주세요"></label>
<label class="cms-wide">요약<textarea name="summary" rows="3" maxlength="1000"></textarea></label>
</div><div class="cms-cover-edit"><label>대표 이미지<input id="cover-upload" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><img id="cover-preview" alt="대표 이미지 미리보기" hidden><button id="remove-cover" type="button">대표 이미지 제외</button><p class="cms-help">카드는 16:9 비율로 표시됩니다. 상세 본문에서는 원본 비율을 유지합니다.</p></div>
<h2>본문</h2><p class="cms-help">본문을 클릭해 바로 수정하세요. 위 도구 모음에서 글자 서식·표·이미지를 넣을 수 있습니다. 이미지를 클릭하면 ALT와 캡션을 수정합니다.</p>
<div class="cms-actions"><button type="button" id="backup-post">원본 백업 받기</button><label>백업 본문 불러오기<input type="file" id="restore-post" accept="application/json"></label><button type="button" id="optimize-existing">기존 업로드 이미지 최적화</button></div>
<div id="blocks"></div><input hidden type="file" id="body-images" accept="image/jpeg,image/png,image/webp,image/avif">
<dialog id="image-tools"><button type="button" id="image-close">닫기</button><h3>선택한 이미지</h3><label>이미지 설명 (ALT)<input id="image-alt"></label><label>캡션<input id="image-caption"></label><button type="button" id="image-apply">이미지 설명 적용</button><button type="button" id="image-delete">사진 삭제</button></dialog>
<button type="button" id="add-faq">FAQ 추가</button>
<details open><summary>뉴스룸·연구자료 추가 정보</summary><div class="cms-fields"><label>자료 유형<select name="subtype"><option value="">선택 안 함</option><option>보도자료</option><option>언론보도</option><option>기업소식</option><option>논문</option><option>인체적용시험</option><option>전임상</option><option>특허</option><option>정부 R&D</option></select></label><label>언론사·기관<input name="publisher"></label><label>원문 URL<input name="source_url" type="url"></label><label>저널명<input name="journal"></label><label>발행연도<input name="year" type="number" min="1900" max="2200"></label><label>DOI<input name="doi"></label></div></details>
<h2>공개용 PDF 첨부</h2><label>PDF 선택<input id="pdf-upload" type="file" accept="application/pdf"></label><ul id="attachments"></ul>
<details><summary>검색 정보</summary><div class="cms-fields"><label>검색 제목<input name="seo_title" placeholder="비워두면 글 제목을 사용합니다"></label><label>검색 설명<textarea name="seo_description" placeholder="비워두면 요약을 사용합니다"></textarea></label><label>키워드<input name="tags" placeholder="균사체, 버섯, GMK"></label></div></details>
<div class="cms-actions cms-save"><button type="button" id="preview">미리보기</button><button type="button" id="save-draft">초안 저장 / 비공개</button><button type="submit" id="publish">게시하기</button><button type="button" id="archive">휴지통으로</button><button type="button" id="back-bottom">목록으로</button></div></form></section>
<dialog id="preview-dialog"><div class="cms-actions"><h2>홈페이지 미리보기</h2><button id="preview-close">닫기</button></div><label>화면 폭<select id="preview-width"><option value="100%">PC</option><option value="390px">모바일</option></select></label><div id="preview-body" class="cms-article"></div></dialog>
</main><script src="/vendor/jodit.min.js"></script><script type="module" src="/admin.js"></script></body></html>
